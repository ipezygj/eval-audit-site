name: site checks

# The site is the sales surface, and every way it breaks is silent: a link that
# 404s, a description that renders as mojibake, a documented board count that no
# longer matches status.json. None of it throws an error for a visitor — it just
# quietly costs one. Run the checks where they cannot be forgotten.
#
# The weekly run matters as much as the push run: status.json is regenerated by a
# machine here at home and pushed twice a day, so the prose can go stale without
# anyone touching a page.

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: links, encoding, and API claims
        run: python check_links.py
      - name: the browser calculator still agrees with evalgate
        # From git, not PyPI: the calculator mirrors evalgate's SOURCE, and PyPI lags it.
        # Installing the release meant the newest pair silently printed "NOT measured" —
        # a green run for a check that never ran.
        #
        # evalgate is private, so an anonymous clone cannot reach it — that is what broke
        # this step from 2026-08-17 to 08-25 ("could not read Username"). It now reads the
        # repo through a READ-ONLY deploy key. A fork PR cannot see that secret, so that
        # case is skipped LOUDLY in the next step instead of passing green: a check that
        # never ran must never look like a check that passed.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          EVALGATE_DEPLOY_KEY: ${{ secrets.EVALGATE_DEPLOY_KEY }}
        run: |
          if [ -z "$EVALGATE_DEPLOY_KEY" ]; then
            echo "::error::EVALGATE_DEPLOY_KEY is missing — parity against evalgate cannot run. Failing rather than skipping silently."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EVALGATE_DEPLOY_KEY" > ~/.ssh/evalgate_ci
          chmod 600 ~/.ssh/evalgate_ci
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/evalgate_ci -o IdentitiesOnly=yes"
          python -m pip install --quiet "eval-integrity @ git+ssh://git@github.com/ipezygj/evalgate"
          python check_calc_parity.py --strict

      - name: parity did NOT run (fork PR cannot read the deploy key)
        # Deliberately noisy. The silent version of this is a green tick on a check that
        # never executed.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning::Calculator/evalgate parity was SKIPPED: fork PRs have no access to EVALGATE_DEPLOY_KEY. This check runs on push to master — do not read this run as parity-verified."
      - name: the calculator still computes in a real browser
        # Weekly, not per push: this installs a browser. The failure it catches — one
        # throwing card blanking all eight — is silent, so it is worth the minutes.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python check_calc_render.py
      - name: production still serves what the repo says
        # Schedule only: on a push, Pages has not deployed that commit yet, so this
        # would be asking the wrong question and failing for the right reason.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python check_live.py --quiet
